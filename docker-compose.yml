services:
  attendance-api:
    build: .
    container_name: attendance-api

    ports:
      - "8000:8000"

    restart: unless-stopped

  attendance-mcp:
    build:
      context: ./mcp-server

    container_name: attendance-mcp

    ports:
      - "8001:8001"

    depends_on:
      - attendance-api

    restart: unless-stopped