name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          pytest

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ai-attendance-dev
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ai-attendance-dev

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Build attendance-api
        run: |
          docker build \
            -t asia-northeast1-docker.pkg.dev/ai-attendance-dev/ai-attendance/attendance-api:${{ github.sha }} \
            .

      - name: Build attendance-mcp
        run: |
          docker build \
            -t asia-northeast1-docker.pkg.dev/ai-attendance-dev/ai-attendance/attendance-mcp:${{ github.sha }} \
            ./mcp-server

      - name: Push attendance-api
        run: |
          docker push \
            asia-northeast1-docker.pkg.dev/ai-attendance-dev/ai-attendance/attendance-api:${{ github.sha }}

      - name: Push attendance-mcp
        run: |
          docker push \
            asia-northeast1-docker.pkg.dev/ai-attendance-dev/ai-attendance/attendance-mcp:${{ github.sha }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="api_image_tag=${{ github.sha }}" \
            -var="mcp_image_tag=${{ github.sha }}"